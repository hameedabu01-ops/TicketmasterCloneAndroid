name: Build Ticketmaster APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        
run: unzip -q TicketmasterCloneAndroid_Project_FIXED.zip -d project_source
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: project_source/TicketmasterCloneAndroid
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ticketmaster-debug-apk
          path: project_source/TicketmasterCloneAndroid/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
